name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""
      create_release:
        description: "Create release"
        required: true
        default: "true"
      upload_artifacts:
        description: "Upload artifacts"
        required: true
        default: "true"
      upload_url:
        description: "Upload URL"
        required: false
        default: ""
      base_hash:
          description: "Commit hash from which to build"
          required: false
          type: string
          default: ""
      mark_latest:
        description: "Mark latest release"
        required: true
        default: "false"
  push:
    tags:
    - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release jobs declare the write scope they need. All other jobs receive no
# repository token permissions by default.
permissions: {}

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  MSRV: "1.91"
  SCCACHE_CACHE_SIZE: "10G"
  BIN_NAMES: "iroh-relay,iroh-dns-server"
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}

jobs:
    create-release:
      if: github.repository == 'manaflow-ai/iroh'
      name: create-release
      permissions:
        contents: write
      runs-on: ubuntu-latest
      outputs:
        upload_url: ${{ steps.release.outputs.upload_url }}
        release_version: ${{ steps.release_version.outputs.value }}
      steps:
      - name: Get the release version from the tag or input
        id: release_version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.release_version }}
        run: |
          release_version="$RELEASE_VERSION_INPUT"
          if [[ -z "$release_version" ]]; then
            # See: https://github.community/t5/GitHub-Actions/How-to-get-just-the-tag-name/m-p/32167/highlight/true#M1027
            release_version="${GITHUB_REF#refs/tags/}"
          fi
          # Accept SemVer prerelease/build segments, but reject ambiguous
          # dotted suffixes such as v1.2.3.foo.
          if [[ ! "$release_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::release version must be a semantic version, got '$release_version'"
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'value=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'version is: %s\n' "$release_version"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Create GitHub release
        id: release
        if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_version.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$RELEASE_TAG"
          upload_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.upload_url')"
          printf 'upload_url=%s\n' "$upload_url" >> "$GITHUB_OUTPUT"

    build_release:
        if: github.repository == 'manaflow-ai/iroh'
        permissions:
          contents: read
        timeout-minutes: 60
        name: Build release binaries
        needs: create-release
        runs-on: ${{ matrix.runner }}
        outputs:
          release_version: ${{ needs.create-release.outputs.release_version }}
          base_hash: ${{ steps.define_hash.outputs.base_hash }}
        continue-on-error: false
        strategy:
          fail-fast: false
          matrix:
            name: [ubuntu-latest, ubuntu-musl-latest, ubuntu-arm-latest, ubuntu-arm-musl-latest, macOS-latest, macOS-arm-latest, windows-latest]
            rust: [stable]
            experimental: [false]
            include:
              - name: ubuntu-arm-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: aarch64
                libc: gnu
                cargo_targets: "aarch64-unknown-linux-gnu"
                runner: [self-hosted, linux, ARM64]
              - name: ubuntu-arm-musl-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: aarch64
                libc: musl
                cargo_targets: "aarch64-unknown-linux-musl"
                runner: [self-hosted, linux, ARM64]
              - name: ubuntu-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: amd64
                libc: gnu
                cargo_targets: "x86_64-unknown-linux-gnu"
                runner: [self-hosted, linux, X64]
              - name: ubuntu-musl-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: amd64
                libc: musl
                cargo_targets: "x86_64-unknown-linux-musl"
                runner: [self-hosted, linux, X64]
              - name: macOS-latest
                os: macOS-latest
                release-os: darwin
                release-arch: x86_64
                cargo_targets: "x86_64-apple-darwin"
                runner: [self-hosted, macOS, ARM64]
              - name: macOS-arm-latest
                os: macOS-latest
                release-os: darwin
                release-arch: aarch64
                cargo_targets: "aarch64-apple-darwin"
                runner: [self-hosted, macOS, ARM64]
              - name: windows-latest
                os: windows-latest
                release-os: windows
                release-arch: amd64
                cargo_targets: "x86_64-pc-windows-msvc"
                runner: [self-hosted, windows, X64]
        env:
          # Using self-hosted runners so use local cache for sccache and
          # not SCCACHE_GHA_ENABLED.
          # RUSTC_WRAPPER: "sccache"
          RUST_BACKTRACE: full
          RUSTV: ${{ matrix.rust }}
        steps:
        - name: Checkout
          if: inputs.base_hash == ''
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            submodules: recursive
            persist-credentials: false

        - name: Checkout specified commit
          if: inputs.base_hash != ''
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ inputs.base_hash }}
            submodules: recursive
            persist-credentials: false

        - name: Set build arch
          env:
            RELEASE_ARCH_VALUE: ${{ matrix.release-arch }}
            RELEASE_OS_VALUE: ${{ matrix.release-os }}
          run: |
            printf 'RELEASE_ARCH=%s\n' "$RELEASE_ARCH_VALUE" >> "$GITHUB_ENV"
            printf 'RELEASE_OS=%s\n' "$RELEASE_OS_VALUE" >> "$GITHUB_ENV"

        - name: Define hash
          if: matrix.os == 'ubuntu-latest'
          id: define_hash
          run: |
            echo "base_hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        - name: Ensure musl support
          if: ${{ contains(matrix.cargo_targets, '-musl') }}
          run: sudo apt-get install musl-tools -y

        - name: Install Rust
          if: matrix.os != 'windows-latest'
          uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
          with:
            toolchain: ${{ matrix.rust }}
            targets: ${{ matrix.cargo_targets }}

        - name: Install Rust
          if: matrix.os == 'windows-latest'
          env:
            TARGET: ${{ matrix.cargo_targets }}
          run: |
            rustup toolchain install stable
            rustup target add "$TARGET"

        - name: build release
          if: matrix.os != 'windows-latest'
          shell: bash
          env:
            TARGET: ${{ matrix.cargo_targets }}
          run: |
            if [ "${{ contains(matrix.cargo_targets, '-musl') }}" = "true" ]; then
              # Native build on self-hosted linux runners; use musl-gcc from musl-tools.
              target_env="$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')"
              export "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
              export CC=musl-gcc
              # `relocation-model=static` is required so rustc selects the
              # non-PIE musl crt1.o (not rcrt1.o) to match the ET_EXEC binary
              # produced by `musl-gcc -static`. Without it the PIE startup
              # code (rcrt1.o) ends up linked into a non-PIE binary and the
              # process segfaults in `_start_c` before reaching `main`.
              export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static -C relocation-model=static -C link-arg=-static"
            fi
            cargo build --profile optimized-release --all-features --target "$TARGET"

        - name: build release
          if: matrix.os == 'windows-latest'
          env:
            TARGET: ${{ matrix.cargo_targets }}
          run: cargo build --profile optimized-release --all-features --target "$TARGET"

        - name: Download awscli (linux x86_64)
          if: matrix.os == 'ubuntu-latest' && matrix.release-arch == 'amd64'
          run: |
            mkdir -p ~/awscli
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o ~/awscli/awscliv2.zip
            cd ~/awscli && unzip -oq awscliv2.zip

        - name: Download awscli (linux aarch64)
          if: matrix.os == 'ubuntu-latest' && matrix.release-arch == 'aarch64'
          run: |
            mkdir -p ~/awscli
            curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o ~/awscli/awscliv2.zip
            cd ~/awscli && unzip -oq awscliv2.zip

        - name: Download awscli (mac)
          if: matrix.os == 'macOS-latest'
          run: |
            mkdir -p ~/awscli
            curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o ~/awscli/AWSCLIV2.pkg

        - name: Install awscli (linux)
          if: matrix.os == 'ubuntu-latest'
          run: sudo ~/awscli/aws/install --update

        - name: Install awscli (mac)
          if: matrix.os == 'macOS-latest'
          run: sudo installer -pkg ~/awscli/AWSCLIV2.pkg -target /

        - name: push release
          if: matrix.os != 'windows-latest' && matrix.libc != 'musl'
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
            AWS_DEFAULT_REGION: us-west-2
          run: |
            aws s3 cp "./target/${{ matrix.cargo_targets }}/optimized-release/iroh-relay" "s3://vorc/iroh-relay-${RELEASE_OS}-${RELEASE_ARCH}-${GITHUB_SHA::7}" --no-progress
            aws s3 cp "./target/${{ matrix.cargo_targets }}/optimized-release/iroh-dns-server" "s3://vorc/iroh-dns-server-${RELEASE_OS}-${RELEASE_ARCH}-${GITHUB_SHA::7}" --no-progress

        - name: push release latest
          if: matrix.os != 'windows-latest' && matrix.libc != 'musl' && (github.event.inputs.mark_latest == 'true' || github.event_name == 'push')
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
            AWS_DEFAULT_REGION: us-west-2
          run: |
            aws s3 cp "./target/${{ matrix.cargo_targets }}/optimized-release/iroh-relay" "s3://vorc/iroh-relay-${RELEASE_OS}-${RELEASE_ARCH}-latest" --no-progress
            aws s3 cp "./target/${{ matrix.cargo_targets }}/optimized-release/iroh-dns-server" "s3://vorc/iroh-dns-server-${RELEASE_OS}-${RELEASE_ARCH}-latest" --no-progress

        - name: push docker release
          if: matrix.os == 'ubuntu-latest' && matrix.libc == 'musl'
          env:
            AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
            AWS_DEFAULT_REGION: us-west-2
          run: |
            aws s3 cp "./target/${{ matrix.cargo_targets }}/optimized-release/iroh-relay" "s3://vorc/iroh-relay-${RELEASE_OS}-${RELEASE_ARCH}-musl-${GITHUB_SHA::7}" --no-progress
            aws s3 cp "./target/${{ matrix.cargo_targets }}/optimized-release/iroh-dns-server" "s3://vorc/iroh-dns-server-${RELEASE_OS}-${RELEASE_ARCH}-musl-${GITHUB_SHA::7}" --no-progress

        - name: Build archives
          if: matrix.os != 'windows-latest'
          shell: bash
          run: |
            IFS=',' read -ra BIN_NAMES <<< "${{ env.BIN_NAMES }}"
            for BIN_NAME in "${BIN_NAMES[@]}"; do
              staging="$BIN_NAME-${{ needs.create-release.outputs.release_version }}-${{ matrix.cargo_targets }}"
              mkdir -p "$staging"
              cp "target/${{ matrix.cargo_targets }}/optimized-release/$BIN_NAME" "$staging/"
              tar czf "$staging.tar.gz" -C "$staging" .
            done

        - name: Build archives (windows)
          if: matrix.os == 'windows-latest'
          shell: pwsh
          run: |
            $BIN_NAMES = "${{ env.BIN_NAMES }}".Split(',')
            foreach ($BIN_NAME in $BIN_NAMES) {
              $staging = "$BIN_NAME-${{ needs.create-release.outputs.release_version }}-${{ matrix.cargo_targets }}"
              New-Item -ItemType Directory -Force -Path "$staging"
              Copy-Item -Path "target/${{ matrix.cargo_targets }}/optimized-release/$BIN_NAME.exe" -Destination "$staging/"
              Set-Location -Path "$staging"
              Compress-Archive -Path * -DestinationPath "../$staging.zip"
              Set-Location -Path ..
            }

        # Keep release archives in Actions artifacts until the hosted publish
        # job uploads them. This build job stays read-only on persistent hosts.
        - name: attach artifacts
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          if : matrix.os != 'windows-latest'
          with:
            name: iroh-${{ matrix.release-os }}-${{ matrix.release-arch }}${{ matrix.libc == 'musl' && '-musl' || '' }}-bundle
            path: iroh-*.tar.gz
            compression-level: 0
            retention-days: 1

        - name: attach artifacts
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          if : matrix.os == 'windows-latest'
          with:
            name: iroh-${{ matrix.release-os }}-${{ matrix.release-arch }}-bundle
            path: iroh-*.zip
            compression-level: 0
            retention-days: 1

    publish-release-assets:
      name: Publish release assets
      if: >-
        github.repository == 'manaflow-ai/iroh' &&
        (github.event_name == 'push' || inputs.upload_artifacts == 'true')
      needs: [create-release, build_release]
      permissions:
        # Only this hosted job needs to mutate the release.
        contents: write
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      steps:
        - name: Verify release and tag binding
          id: release
          shell: bash
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ needs.create-release.outputs.release_version }}
            RELEASE_UPLOAD_URL: ${{ inputs.upload_url || needs.create-release.outputs.upload_url }}
            EVENT_NAME: ${{ github.event_name }}
            EVENT_REF: ${{ github.ref }}
            REPOSITORY: ${{ github.repository }}
          run: |
            set -euo pipefail
            if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::invalid release tag: $RELEASE_TAG"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" != "refs/tags/$RELEASE_TAG" ]]; then
              echo "::error::release tag does not match the pushed tag"
              exit 1
            fi
            if [[ -z "$RELEASE_UPLOAD_URL" ]]; then
              echo "::error::release upload URL is missing"
              exit 1
            fi

            release_json="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
            actual_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
            actual_upload_url="$(jq -r '.upload_url // empty' <<<"$release_json")"
            expected_upload_url="${RELEASE_UPLOAD_URL%%\{*}"
            actual_upload_url="${actual_upload_url%%\{*}"
            if [[ "$actual_tag" != "$RELEASE_TAG" || -z "$actual_upload_url" || "$actual_upload_url" != "$expected_upload_url" ]]; then
              echo "::error::release metadata changed or does not match the requested upload URL"
              exit 1
            fi
            printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            printf 'upload_url=%s\n' "$actual_upload_url" >> "$GITHUB_OUTPUT"

        - name: Download release archives
          uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
          with:
            pattern: iroh-*-bundle
            path: release-assets
            merge-multiple: true

        - name: Require release archives
          shell: bash
          run: |
            set -euo pipefail
            if ! find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit | grep -q .; then
              echo "::error::no release archives were produced"
              exit 1
            fi

        - name: Upload release archives
          uses: n0-computer/actions-upload-release-asset@2613dacb5369f21a7e14f8eedce32ea9f88bb19f
          with:
            # Keep the write-capable token scoped to this one hosted action.
            github_token: ${{ secrets.GITHUB_TOKEN }}
            upload_url: ${{ steps.release.outputs.upload_url }}
            asset_path: release-assets/*

    docker:
      if: github.repository == 'manaflow-ai/iroh'
      needs: build_release
      uses: './.github/workflows/docker.yaml'
      secrets:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      with:
        release_version: ${{ needs.build_release.outputs.release_version }}
        base_hash: ${{ needs.build_release.outputs.base_hash }}
        publish: true
