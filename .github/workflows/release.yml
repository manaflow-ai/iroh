name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""
      create_release:
        description: "Create release"
        required: true
        default: "true"
      upload_artifacts:
        description: "Upload artifacts"
        required: true
        default: "true"
      upload_url:
        description: "Upload URL"
        required: false
        default: ""
      base_hash:
          description: "Commit hash from which to build"
          required: false
          type: string
          default: ""
      mark_latest:
        description: "Mark latest release"
        required: true
        default: "false"
  push:
    tags:
    - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Release jobs declare the write scope they need. All other jobs receive no
# repository token permissions by default.
permissions: {}

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  MSRV: "1.91"
  SCCACHE_CACHE_SIZE: "10G"
  BIN_NAMES: "iroh-relay,iroh-dns-server"
  RELEASE_VERSION: ${{ github.event.inputs.release_version }}

jobs:
    create-release:
      if: >-
        github.repository == 'manaflow-ai/iroh' &&
        (github.event_name == 'push' || github.ref == 'refs/heads/main')
      name: create-release
      permissions:
        contents: write
      runs-on: ubuntu-latest
      outputs:
        upload_url: ${{ steps.release.outputs.upload_url }}
        release_version: ${{ steps.release_version.outputs.value }}
      steps:
      - name: Get the release version from the tag or input
        id: release_version
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ github.event.inputs.release_version }}
        run: |
          release_version="$RELEASE_VERSION_INPUT"
          if [[ -z "$release_version" ]]; then
            # See: https://github.community/t5/GitHub-Actions/How-to-get-just-the-tag-name/m-p/32167/highlight/true#M1027
            release_version="${GITHUB_REF#refs/tags/}"
          fi
          # Docker tags do not permit '+', so accept the SemVer core and
          # prerelease portion but reject build metadata at the release gate.
          if [[ ! "$release_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::release version must be a Docker-compatible semantic version (no build metadata), got '$release_version'"
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          printf 'value=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'version is: %s\n' "$release_version"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Create GitHub release
        id: release
        if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_version.outputs.value }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "$RELEASE_TAG"
          upload_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.upload_url')"
          printf 'upload_url=%s\n' "$upload_url" >> "$GITHUB_OUTPUT"

    build_release:
        if: >-
          github.repository == 'manaflow-ai/iroh' &&
          (github.event_name == 'push' || github.ref == 'refs/heads/main')
        permissions:
          contents: read
        timeout-minutes: 60
        name: Build release binaries
        needs: create-release
        runs-on: ${{ matrix.runner }}
        outputs:
          release_version: ${{ needs.create-release.outputs.release_version }}
          base_hash: ${{ steps.define_hash.outputs.base_hash }}
        continue-on-error: false
        strategy:
          fail-fast: false
          matrix:
            name: [ubuntu-latest, ubuntu-musl-latest, ubuntu-arm-latest, ubuntu-arm-musl-latest, macOS-latest, macOS-arm-latest, windows-latest]
            rust: [stable]
            experimental: [false]
            include:
              - name: ubuntu-arm-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: aarch64
                libc: gnu
                cargo_targets: "aarch64-unknown-linux-gnu"
                runner: ubuntu-24.04-arm
              - name: ubuntu-arm-musl-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: aarch64
                libc: musl
                cargo_targets: "aarch64-unknown-linux-musl"
                runner: ubuntu-24.04-arm
              - name: ubuntu-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: amd64
                libc: gnu
                cargo_targets: "x86_64-unknown-linux-gnu"
                runner: ubuntu-24.04
              - name: ubuntu-musl-latest
                os: ubuntu-latest
                release-os: linux
                release-arch: amd64
                libc: musl
                cargo_targets: "x86_64-unknown-linux-musl"
                runner: ubuntu-24.04
              - name: macOS-latest
                os: macOS-latest
                release-os: darwin
                release-arch: x86_64
                cargo_targets: "x86_64-apple-darwin"
                runner: macos-14
              - name: macOS-arm-latest
                os: macOS-latest
                release-os: darwin
                release-arch: aarch64
                cargo_targets: "aarch64-apple-darwin"
                runner: macos-14
              - name: windows-latest
                os: windows-latest
                release-os: windows
                release-arch: amd64
                cargo_targets: "x86_64-pc-windows-msvc"
                runner: windows-2025
        env:
          # Release builds run on versioned GitHub-hosted runners. They have
          # no release credentials; all publishing happens in dedicated jobs.
          RUST_BACKTRACE: full
          RUSTV: ${{ matrix.rust }}
        steps:
        - name: Checkout
          if: inputs.base_hash == ''
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            submodules: recursive
            persist-credentials: false

        - name: Checkout specified commit
          if: inputs.base_hash != ''
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            ref: ${{ inputs.base_hash }}
            submodules: recursive
            persist-credentials: false

        - name: Set build arch
          env:
            RELEASE_ARCH_VALUE: ${{ matrix.release-arch }}
            RELEASE_OS_VALUE: ${{ matrix.release-os }}
          run: |
            printf 'RELEASE_ARCH=%s\n' "$RELEASE_ARCH_VALUE" >> "$GITHUB_ENV"
            printf 'RELEASE_OS=%s\n' "$RELEASE_OS_VALUE" >> "$GITHUB_ENV"

        - name: Define hash
          if: matrix.os == 'ubuntu-latest'
          id: define_hash
          run: |
            echo "base_hash=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

        - name: Ensure musl support
          if: ${{ contains(matrix.cargo_targets, '-musl') }}
          run: sudo apt-get install musl-tools -y

        - name: Install Rust
          if: matrix.os != 'windows-latest'
          uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
          with:
            toolchain: ${{ matrix.rust }}
            targets: ${{ matrix.cargo_targets }}

        - name: Install Rust
          if: matrix.os == 'windows-latest'
          env:
            TARGET: ${{ matrix.cargo_targets }}
          run: |
            rustup toolchain install stable
            rustup target add "$TARGET"

        - name: build release
          if: matrix.os != 'windows-latest'
          shell: bash
          env:
            TARGET: ${{ matrix.cargo_targets }}
          run: |
            if [ "${{ contains(matrix.cargo_targets, '-musl') }}" = "true" ]; then
              # Native build on the hosted Linux runner; use musl-gcc from musl-tools.
              target_env="$(printf '%s' "$TARGET" | tr 'a-z-' 'A-Z_')"
              export "CARGO_TARGET_${target_env}_LINKER=musl-gcc"
              export CC=musl-gcc
              # `relocation-model=static` is required so rustc selects the
              # non-PIE musl crt1.o (not rcrt1.o) to match the ET_EXEC binary
              # produced by `musl-gcc -static`. Without it the PIE startup
              # code (rcrt1.o) ends up linked into a non-PIE binary and the
              # process segfaults in `_start_c` before reaching `main`.
              export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static -C relocation-model=static -C link-arg=-static"
            fi
            cargo build --profile optimized-release --all-features --target "$TARGET"

        - name: build release
          if: matrix.os == 'windows-latest'
          env:
            TARGET: ${{ matrix.cargo_targets }}
          run: cargo build --profile optimized-release --all-features --target "$TARGET"

        - name: Build archives
          if: matrix.os != 'windows-latest'
          shell: bash
          run: |
            IFS=',' read -ra BIN_NAMES <<< "${{ env.BIN_NAMES }}"
            for BIN_NAME in "${BIN_NAMES[@]}"; do
              staging="$BIN_NAME-${{ needs.create-release.outputs.release_version }}-${{ matrix.cargo_targets }}"
              mkdir -p "$staging"
              cp "target/${{ matrix.cargo_targets }}/optimized-release/$BIN_NAME" "$staging/"
              tar czf "$staging.tar.gz" -C "$staging" .
            done

        - name: Build archives (windows)
          if: matrix.os == 'windows-latest'
          shell: pwsh
          run: |
            $BIN_NAMES = "${{ env.BIN_NAMES }}".Split(',')
            foreach ($BIN_NAME in $BIN_NAMES) {
              $staging = "$BIN_NAME-${{ needs.create-release.outputs.release_version }}-${{ matrix.cargo_targets }}"
              New-Item -ItemType Directory -Force -Path "$staging"
              Copy-Item -Path "target/${{ matrix.cargo_targets }}/optimized-release/$BIN_NAME.exe" -Destination "$staging/"
              Set-Location -Path "$staging"
              Compress-Archive -Path * -DestinationPath "../$staging.zip"
              Set-Location -Path ..
            }

        # Stage the Linux binaries for the S3 publisher. Keeping these files
        # in an immutable run artifact removes cloud credentials from every
        # build matrix cell.
        - name: Stage Linux release binaries
          if: matrix.os == 'ubuntu-latest'
          shell: bash
          env:
            TARGET: ${{ matrix.cargo_targets }}
            RELEASE_OS_VALUE: ${{ matrix.release-os }}
            RELEASE_ARCH_VALUE: ${{ matrix.release-arch }}
            LIBC_SUFFIX: ${{ matrix.libc == 'musl' && '-musl' || '' }}
            BUILD_SHA: ${{ github.sha }}
          run: |
            set -euo pipefail
            mkdir -p release-binaries
            short_sha="${BUILD_SHA:0:7}"
            for binary in iroh-relay iroh-dns-server; do
              source="target/${TARGET}/optimized-release/${binary}"
              destination="release-binaries/${binary}-${RELEASE_OS_VALUE}-${RELEASE_ARCH_VALUE}${LIBC_SUFFIX}-${short_sha}"
              test -f "$source"
              cp -- "$source" "$destination"
            done

        - name: Attach Linux release binaries
          if: matrix.os == 'ubuntu-latest'
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          with:
            name: iroh-${{ matrix.release-os }}-${{ matrix.release-arch }}${{ matrix.libc == 'musl' && '-musl' || '' }}-binaries
            path: release-binaries/*
            if-no-files-found: error
            compression-level: 0
            retention-days: 1

        # Keep release archives in Actions artifacts until the hosted publish
        # job uploads them. Build jobs have no release credentials.
        - name: attach artifacts
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          if : matrix.os != 'windows-latest'
          with:
            name: iroh-${{ matrix.release-os }}-${{ matrix.release-arch }}${{ matrix.libc == 'musl' && '-musl' || '' }}-bundle
            path: iroh-*.tar.gz
            compression-level: 0
            retention-days: 1

        - name: attach artifacts
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          if : matrix.os == 'windows-latest'
          with:
            name: iroh-${{ matrix.release-os }}-${{ matrix.release-arch }}-bundle
            path: iroh-*.zip
            compression-level: 0
            retention-days: 1

    publish-s3-binaries:
      name: Publish release binaries
      # S3 publication is separate from all builds. This job is the only job
      # that receives the S3 credentials, and it runs on a versioned hosted
      # runner after the complete build matrix succeeds.
      if: >-
        github.repository == 'manaflow-ai/iroh' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && inputs.create_release == 'true'))
      needs: [create-release, build_release]
      permissions:
        contents: read
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      steps:
        - name: Verify release source
          shell: bash
          env:
            GH_TOKEN: ${{ github.token }}
            RELEASE_TAG: ${{ needs.create-release.outputs.release_version }}
            EVENT_NAME: ${{ github.event_name }}
            EVENT_REF: ${{ github.ref }}
            REPOSITORY: ${{ github.repository }}
          run: |
            set -euo pipefail
            if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::invalid Docker-compatible release tag (no build metadata): $RELEASE_TAG"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" != "refs/tags/$RELEASE_TAG" ]]; then
              echo "::error::release tag does not match the pushed tag"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "::error::manual publication is allowed only from main"
              exit 1
            fi
            release_json="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
            actual_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
            if [[ "$actual_tag" != "$RELEASE_TAG" ]]; then
              echo "::error::release metadata does not match the requested tag"
              exit 1
            fi

        - name: Download release binaries
          uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
          with:
            pattern: iroh-*-binaries
            path: release-binaries
            merge-multiple: true

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
          with:
            aws-access-key-id: ${{ secrets.S3_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.S3_ACCESS_KEY }}
            aws-region: us-west-2

        - name: Require and upload release binaries
          shell: bash
          env:
            BUILD_SHA: ${{ github.sha }}
            MARK_LATEST: ${{ github.event_name == 'push' || inputs.mark_latest == 'true' }}
          run: |
            set -euo pipefail
            short_sha="${BUILD_SHA:0:7}"
            shopt -s nullglob
            for binary in iroh-relay iroh-dns-server; do
              files=("release-binaries/${binary}-linux-"*)
              if (( ${#files[@]} != 4 )); then
                echo "::error::expected four Linux ${binary} artifacts, found ${#files[@]}"
                exit 1
              fi
              for source in "${files[@]}"; do
                filename="${source##*/}"
                if [[ ! "$filename" =~ ^${binary}-linux-(amd64|aarch64)(-musl)?-${short_sha}$ ]]; then
                  echo "::error::unexpected release artifact name: $filename"
                  exit 1
                fi
                aws s3 cp "$source" "s3://vorc/$filename" --no-progress
                if [[ "$MARK_LATEST" == "true" && "$filename" != *-musl-${short_sha} ]]; then
                  latest="${filename%-${short_sha}}-latest"
                  aws s3 cp "$source" "s3://vorc/$latest" --no-progress
                fi
              done
            done

    publish-release-assets:
      name: Publish release assets
      if: >-
        github.repository == 'manaflow-ai/iroh' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && inputs.create_release == 'true' &&
        inputs.upload_artifacts == 'true'))
      needs: [create-release, build_release]
      permissions:
        # Only this hosted job needs to mutate the release.
        contents: write
      runs-on: ubuntu-24.04
      timeout-minutes: 15
      steps:
        - name: Verify release and tag binding
          id: release
          shell: bash
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ needs.create-release.outputs.release_version }}
            RELEASE_UPLOAD_URL: ${{ inputs.upload_url || needs.create-release.outputs.upload_url }}
            EVENT_NAME: ${{ github.event_name }}
            EVENT_REF: ${{ github.ref }}
            REPOSITORY: ${{ github.repository }}
          run: |
            set -euo pipefail
            if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              echo "::error::invalid Docker-compatible release tag (no build metadata): $RELEASE_TAG"
              exit 1
            fi
            if [[ "$EVENT_NAME" == "push" && "$EVENT_REF" != "refs/tags/$RELEASE_TAG" ]]; then
              echo "::error::release tag does not match the pushed tag"
              exit 1
            fi
            if [[ -z "$RELEASE_UPLOAD_URL" ]]; then
              echo "::error::release upload URL is missing"
              exit 1
            fi

            release_json="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG")"
            actual_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
            actual_upload_url="$(jq -r '.upload_url // empty' <<<"$release_json")"
            expected_upload_url="${RELEASE_UPLOAD_URL%%\{*}"
            actual_upload_url="${actual_upload_url%%\{*}"
            if [[ "$actual_tag" != "$RELEASE_TAG" || -z "$actual_upload_url" || "$actual_upload_url" != "$expected_upload_url" ]]; then
              echo "::error::release metadata changed or does not match the requested upload URL"
              exit 1
            fi
            printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            printf 'upload_url=%s\n' "$actual_upload_url" >> "$GITHUB_OUTPUT"

        - name: Download release archives
          uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
          with:
            pattern: iroh-*-bundle
            path: release-assets
            merge-multiple: true

        - name: Require release archives
          shell: bash
          run: |
            set -euo pipefail
            if ! find release-assets -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit | grep -q .; then
              echo "::error::no release archives were produced"
              exit 1
            fi

        - name: Upload release archives
          uses: n0-computer/actions-upload-release-asset@2613dacb5369f21a7e14f8eedce32ea9f88bb19f
          with:
            # Keep the write-capable token scoped to this one hosted action.
            github_token: ${{ secrets.GITHUB_TOKEN }}
            upload_url: ${{ steps.release.outputs.upload_url }}
            asset_path: release-assets/*

    docker:
      if: >-
        github.repository == 'manaflow-ai/iroh' &&
        (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' && inputs.create_release == 'true'))
      needs: [build_release, publish-s3-binaries]
      uses: './.github/workflows/docker.yaml'
      secrets:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      with:
        release_version: ${{ needs.build_release.outputs.release_version }}
        base_hash: ${{ needs.build_release.outputs.base_hash }}
        publish: true
