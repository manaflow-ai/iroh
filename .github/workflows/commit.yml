name: Commits

on:
  # Evaluate the base-branch workflow so a fork cannot add a privileged job.
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  check-for-cc:
    runs-on: ubuntu-latest
    steps:
      - name: check-for-cc
        id: check-for-cc
        uses: agenthunt/conventional-commit-checker-action@f1823f632e95a64547566dcd2c7da920e67117ad
        with:
          pr-title-regex: "^(.+)(?:(([^)s]+)))?!?: (.+)"
