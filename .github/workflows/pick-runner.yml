# Reusable workflow: pick-runner — live-availability overflow routing
# with per-slot spreading.
#
# Lives at `.github/workflows/pick-runner.yml` in `n0-computer/tools`.
#
# HOW ROUTING WORKS:
#   pick-runner queries self-hosted linux X64 idle count once at dispatch
#   time, then emits up to 16 per-slot runs-on arrays (`overflow_1` through
#   `overflow_16`). Each caller job picks a slot number; trusted runs use the
#   first `idle` slots for self-hosted work and route the rest to the configured
#   overflow runner.
#
#   Example, with idle=2 and 5 overflow jobs (slots 1..5):
#     slot 1 → self-hosted       (1 <= 2)
#     slot 2 → self-hosted       (2 <= 2)
#     slot 3 → overflow           (3 > 2)
#     slot 4 → overflow
#     slot 5 → overflow
#
#   MIN_FREE_RUNNERS acts as a quality gate: if idle < min_free_runners, we
#   don't spread at all and send the whole batch to hosted runners. This avoids
#   stranding a single job on a nearly-full self-hosted pool where the batch
#   wall-clock would be dominated by that one job's queue wait.
#
# CALLER PATTERN:
#   jobs:
#     pick-runner:
#       uses: ./.github/workflows/pick-runner.yml
#       with:
#         min_free_runners: 3
#       secrets:
#         RUNNER_READ_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
#
#     clippy_check:
#       needs: pick-runner
#       runs-on: ${{ fromJSON(needs.pick-runner.outputs.overflow_1) }}
#       ...
#
#     check_docs:
#       needs: pick-runner
#       runs-on: ${{ fromJSON(needs.pick-runner.outputs.overflow_2) }}
#       ...
#
#   Assign slot numbers 1..N to the overflow jobs in your workflow. Slot
#   assignment is arbitrary (jobs run in parallel regardless) — it just
#   determines the routing split.
#
# PREREQUISITES:
#   1. Shared repo accessible to callers: Settings → Actions → General →
#      Access: "Accessible from repositories in the 'n0-computer' organization"
#      on the tools repo.
#   2. RUNNER_READ_TOKEN secret (per-repo or at org level scoped to callers).
#      Required permission for GET /orgs/{org}/actions/runners:
#        - Fine-grained PAT: Organization permissions →
#          "Self-hosted runners: Read"   ← recommended
#        - Classic PAT: `admin:org` scope (broader; use if fine-grained tokens
#          aren't available — note `read:org` alone is NOT sufficient for
#          this endpoint, despite the name).
#        - GitHub App: Organization permissions → Self-hosted runners: Read.
#      Without the secret, pick-runner falls back to hosted runners. A failed
#      availability query must never route untrusted code to a persistent host.

name: Pick runner (reusable, per-slot)

permissions:
  contents: read
  # The picker reads runner availability through the optional scoped secret.
  actions: read

on:
  workflow_call:
    inputs:
      org:
        description: GitHub org that owns the self-hosted runners
        type: string
        default: n0-computer
      min_free_runners:
        description: >
          Below this idle count, don't spread — send the whole batch to
          Blacksmith. Avoids stranding a single job behind a slow self-hosted
          queue. Set to 1 to always use any idle self-hosted slot.
        type: number
        default: 3
      core_runner:
        description: >
          JSON array for the `core` class (always this). Also the label set
          used to count idle self-hosted capacity for this platform
          (case-insensitive). Pass e.g. '["self-hosted","windows","x64"]' to
          route a Windows batch.
        type: string
        default: '["self-hosted","linux","X64"]'
      overflow_runner:
        description: JSON array for overflow slots that land on Blacksmith
        type: string
        default: '["blacksmith-4vcpu-ubuntu-2204"]'
      hosted_fallback_runner:
        description: JSON array with one GitHub-hosted label for fail-closed routing
        type: string
        default: '["ubuntu-latest"]'
      blacksmith_busy_match:
        description: >
          Substring a busy Blacksmith runner's labels must contain to count
          toward THIS platform's cap (e.g. `ubuntu` or `windows`). Keeps the
          per-platform `max_blacksmith_concurrent` caps independent.
        type: string
        default: ubuntu
      max_blacksmith_concurrent:
        description: >
          Soft cap on total Blacksmith runners busy across the org. If the
          current busy count is >= this value, this batch is forced to
          self-hosted regardless of idle count. Prevents unbounded overflow
          spend when multiple repos spill simultaneously. Set to 0 to disable.
        type: number
        default: 10
    outputs:
      core:
        description: JSON array for `runs-on` — always self-hosted
        value: ${{ jobs.pick.outputs.core }}
      idle:
        description: Idle self-hosted linux X64 runners at decision time
        value: ${{ jobs.pick.outputs.idle }}
      decision:
        description: Human-readable routing summary (for logs/debugging)
        value: ${{ jobs.pick.outputs.decision }}
      # Per-slot overflow outputs. Caller picks a slot per job.
      overflow_1:
        description: overflow slot 1 (lowest — most likely self-hosted)
        value: ${{ jobs.pick.outputs.overflow_1 }}
      overflow_2:
        description: overflow slot 2
        value: ${{ jobs.pick.outputs.overflow_2 }}
      overflow_3:
        description: overflow slot 3
        value: ${{ jobs.pick.outputs.overflow_3 }}
      overflow_4:
        description: overflow slot 4
        value: ${{ jobs.pick.outputs.overflow_4 }}
      overflow_5:
        description: overflow slot 5
        value: ${{ jobs.pick.outputs.overflow_5 }}
      overflow_6:
        description: overflow slot 6
        value: ${{ jobs.pick.outputs.overflow_6 }}
      overflow_7:
        description: overflow slot 7
        value: ${{ jobs.pick.outputs.overflow_7 }}
      overflow_8:
        description: overflow slot 8
        value: ${{ jobs.pick.outputs.overflow_8 }}
      overflow_9:
        description: overflow slot 9
        value: ${{ jobs.pick.outputs.overflow_9 }}
      overflow_10:
        description: overflow slot 10
        value: ${{ jobs.pick.outputs.overflow_10 }}
      overflow_11:
        description: overflow slot 11
        value: ${{ jobs.pick.outputs.overflow_11 }}
      overflow_12:
        description: overflow slot 12
        value: ${{ jobs.pick.outputs.overflow_12 }}
      overflow_13:
        description: overflow slot 13
        value: ${{ jobs.pick.outputs.overflow_13 }}
      overflow_14:
        description: overflow slot 14
        value: ${{ jobs.pick.outputs.overflow_14 }}
      overflow_15:
        description: overflow slot 15
        value: ${{ jobs.pick.outputs.overflow_15 }}
      overflow_16:
        description: overflow slot 16
        value: ${{ jobs.pick.outputs.overflow_16 }}
    secrets:
      RUNNER_READ_TOKEN:
        description: PAT with read:org scope for runner availability query
        required: false

jobs:
  pick:
    name: Pick runner (live availability, per-slot)
    # This routing job always runs on GitHub-hosted infrastructure. External
    # pull requests are handled without the runner-read secret and resolve all
    # slots to the hosted fallback below.
    if: github.repository == 'manaflow-ai/iroh'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      core: ${{ steps.p.outputs.core }}
      idle: ${{ steps.p.outputs.idle }}
      blacksmith_busy: ${{ steps.p.outputs.blacksmith_busy }}
      decision: ${{ steps.p.outputs.decision }}
      overflow_1:  ${{ steps.p.outputs.overflow_1 }}
      overflow_2:  ${{ steps.p.outputs.overflow_2 }}
      overflow_3:  ${{ steps.p.outputs.overflow_3 }}
      overflow_4:  ${{ steps.p.outputs.overflow_4 }}
      overflow_5:  ${{ steps.p.outputs.overflow_5 }}
      overflow_6:  ${{ steps.p.outputs.overflow_6 }}
      overflow_7:  ${{ steps.p.outputs.overflow_7 }}
      overflow_8:  ${{ steps.p.outputs.overflow_8 }}
      overflow_9:  ${{ steps.p.outputs.overflow_9 }}
      overflow_10: ${{ steps.p.outputs.overflow_10 }}
      overflow_11: ${{ steps.p.outputs.overflow_11 }}
      overflow_12: ${{ steps.p.outputs.overflow_12 }}
      overflow_13: ${{ steps.p.outputs.overflow_13 }}
      overflow_14: ${{ steps.p.outputs.overflow_14 }}
      overflow_15: ${{ steps.p.outputs.overflow_15 }}
      overflow_16: ${{ steps.p.outputs.overflow_16 }}
    steps:
      - id: p
        env:
          MIN_FREE_RUNNERS: ${{ inputs.min_free_runners }}
          MAX_BLACKSMITH_CONCURRENT: ${{ inputs.max_blacksmith_concurrent }}
          CORE_RUNNER: ${{ inputs.core_runner }}
          OVERFLOW_RUNNER: ${{ inputs.overflow_runner }}
          HOSTED_FALLBACK_RUNNER: ${{ inputs.hosted_fallback_runner }}
          BS_MATCH: ${{ inputs.blacksmith_busy_match }}
          ORG: ${{ inputs.org }}
          TRUSTED_SOURCE: ${{ github.repository == 'manaflow-ai/iroh' && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
          GH_TOKEN: >-
            ${{
              github.repository == 'manaflow-ai/iroh' &&
              (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) &&
              secrets.RUNNER_READ_TOKEN || github.token
            }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep the fail-closed route on a known GitHub-hosted label. The
          # allowlist prevents a caller typo from turning the fallback into a
          # self-hosted label. Invalid input uses the safest Linux default.
          if ! HOSTED_RUNNER="$(jq -cn --argjson candidate "$HOSTED_FALLBACK_RUNNER" '
            if (($candidate | type) == "array"
                and ($candidate | length) == 1
                and (["ubuntu-latest","ubuntu-24.04","ubuntu-22.04",
                      "windows-latest","windows-2025","windows-2022",
                      "macos-latest","macos-26","macos-15","macos-14","macos-13"]
                    | index($candidate[0]) != null))
            then $candidate
            else ["ubuntu-latest"]
            end' 2>/dev/null)"; then
            HOSTED_RUNNER='["ubuntu-latest"]'
          fi
          EFFECTIVE_CORE_RUNNER="$CORE_RUNNER"
          EFFECTIVE_OVERFLOW_RUNNER="$OVERFLOW_RUNNER"
          IDLE="unknown"
          BS_BUSY="unknown"
          SELF_HOSTED_SLOTS=0

          # A pull request from another repository is untrusted, even when its
          # workflow runs in this repository. Keep it on an ephemeral hosted
          # runner. The repository check also prevents a copied workflow in a
          # fork from selecting the organization's runner pool.
          if [[ "$TRUSTED_SOURCE" != "true" ]]; then
            EFFECTIVE_CORE_RUNNER="$HOSTED_RUNNER"
            EFFECTIVE_OVERFLOW_RUNNER="$HOSTED_RUNNER"
            ROUTE="all hosted (untrusted source)"
          elif ! RUNNERS_JSON="$(gh api "/orgs/${ORG}/actions/runners" --paginate 2>/dev/null)"; then
            EFFECTIVE_CORE_RUNNER="$HOSTED_RUNNER"
            EFFECTIVE_OVERFLOW_RUNNER="$HOSTED_RUNNER"
            ROUTE="all hosted (runner availability unavailable)"
            echo "::warning::runner availability query failed; defaulting to hosted runners"
          else
            # One paginated fetch, counted twice. Avoid a second round-trip.
            IDLE="$(echo "$RUNNERS_JSON" | jq -s --argjson want "$CORE_RUNNER" '[.[] | .runners[]?]
                   | [.[] | select(.status=="online" and .busy==false
                                   and ([.labels[].name | ascii_downcase]
                                        | contains($want | map(ascii_downcase))))]
                   | length' 2>/dev/null || echo "")"

            # Count busy runners whose labels include a "blacksmith-" prefixed
            # label and a label containing $BS_MATCH (for example, "ubuntu" or
            # "windows"), so each platform's cap remains independent.
            BS_BUSY="$(echo "$RUNNERS_JSON" | jq -s --arg os "$BS_MATCH" '[.[] | .runners[]?]
                      | [.[] | select(.busy==true
                                      and ([.labels[].name | ascii_downcase] | any(startswith("blacksmith-")))
                                      and ([.labels[].name | ascii_downcase] | any(contains($os | ascii_downcase)))) ]
                      | length' 2>/dev/null || echo "")"

            # Decide how many slots get self-hosted.
            #
            #   API/JSON failed          -> all hosted (fail closed)
            #   blacksmith at cap        -> all self-hosted (trusted source)
            #   idle < min threshold     -> all hosted (avoid queue stranding)
            #   idle >= min threshold    -> first `idle` slots self-hosted, rest overflow
            if [[ -z "$IDLE" || ! "$IDLE" =~ ^[0-9]+$ || -z "$BS_BUSY" || ! "$BS_BUSY" =~ ^[0-9]+$ ]]; then
              EFFECTIVE_CORE_RUNNER="$HOSTED_RUNNER"
              EFFECTIVE_OVERFLOW_RUNNER="$HOSTED_RUNNER"
              ROUTE="all hosted (runner availability invalid)"
              echo "::warning::runner availability response was invalid; defaulting to hosted runners"
            elif (( MAX_BLACKSMITH_CONCURRENT > 0 )) && (( BS_BUSY >= MAX_BLACKSMITH_CONCURRENT )); then
              SELF_HOSTED_SLOTS=16
              ROUTE="all self-hosted (blacksmith at cap: bs_busy=${BS_BUSY} >= max=${MAX_BLACKSMITH_CONCURRENT})"
            elif (( IDLE < MIN_FREE_RUNNERS )); then
              EFFECTIVE_CORE_RUNNER="$HOSTED_RUNNER"
              EFFECTIVE_OVERFLOW_RUNNER="$HOSTED_RUNNER"
              ROUTE="all hosted (idle=${IDLE} < min=${MIN_FREE_RUNNERS})"
            else
              SELF_HOSTED_SLOTS="$IDLE"
              (( SELF_HOSTED_SLOTS > 16 )) && SELF_HOSTED_SLOTS=16
              ROUTE="spread (idle=${IDLE}: first ${SELF_HOSTED_SLOTS} slots self-hosted, rest overflow)"
            fi
          fi

          {
            echo "core=${EFFECTIVE_CORE_RUNNER}"
            for i in $(seq 1 16); do
              if (( i <= SELF_HOSTED_SLOTS )); then
                echo "overflow_${i}=${EFFECTIVE_CORE_RUNNER}"
              else
                echo "overflow_${i}=${EFFECTIVE_OVERFLOW_RUNNER}"
              fi
            done
            echo "decision=${ROUTE}"
            echo "idle=${IDLE}"
            echo "blacksmith_busy=${BS_BUSY}"
          } >> "$GITHUB_OUTPUT"
          echo "--------------------------------------------------------"
          echo "Idle self-hosted linux-X64: ${IDLE}  (min threshold: ${MIN_FREE_RUNNERS})"
          echo "Blacksmith runners busy:    ${BS_BUSY}  (max: ${MAX_BLACKSMITH_CONCURRENT})"
          echo "Self-hosted slots:          1..${SELF_HOSTED_SLOTS}"
          echo "Overflow slots:             $((SELF_HOSTED_SLOTS+1))..16"
          echo "Decision: ${ROUTE}"
          echo "--------------------------------------------------------"
