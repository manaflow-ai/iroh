name: Docs Preview

on:
  # This workflow writes the generated-docs branch. Keep its definition on the
  # base branch and run it only for trusted same-repository pull requests.
  pull_request_target:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string

# ensure job runs sequentially so pushing to the preview branch doesn't conflict
concurrency:
  group: ci-docs-preview

permissions:
  contents: read

env:
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  preview_docs:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 30
    name: Docs preview
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: "sccache"
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_CACHE_SIZE: "10G"
      PREVIEW_PATH: pr/${{ github.event.pull_request.number || inputs.pr_number }}/docs

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
      with:
        toolchain: nightly-2025-10-09
    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
      continue-on-error: true
    - uses: ./.github/workflows/sccache-probe

    - name: Generate Docs
      run: cargo doc --workspace --all-features --no-deps
      env:
        RUSTDOCFLAGS: --cfg iroh_docsrs

    - name: Deploy Docs to Preview Branch
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/doc/
        destination_dir: ${{ env.PREVIEW_PATH }}
        publish_branch: generated-docs-preview

    - name: Find Docs Comment
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number || inputs.pr_number }}
        comment-author: 'github-actions[bot]'
        body-includes: Documentation for this PR has been generated

    - name: Get current timestamp
      id: get_timestamp
      shell: bash
      run: printf 'timestamp=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Create or Update Docs Comment
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
      with:
        issue-number: ${{ github.event.pull_request.number || inputs.pr_number }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        body: |
          Documentation for this PR has been generated and is available at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.PREVIEW_PATH }}/iroh/

          Last updated: ${{ steps.get_timestamp.outputs.timestamp }}
        edit-mode: replace
