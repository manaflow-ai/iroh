name: netsim-runner

on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      max_workers:
        required: true
        type: number
        default: 4
      netsim_branch:
        required: true
        type: string
        default: "main"
      rust_log:
        description: "Custom RUST_LOG value (e.g. 'iroh=debug,noq=trace'). If empty, defaults to warn."
        required: false
        type: string
        default: ""
      build_profile:
        required: false
        type: string
        default: "release"
      sim_paths:
        required: false
        type: string
        default: "sims/iroh,sims/integration"
      publish_metrics:
        required: false
        type: boolean
        default: false
      pr_number:
        required: false
        type: string
        default: ""
      report_table:
        required: false
        type: boolean
        default: false
      filter:
        description: "Test filter: 'skip:test1,test2' to exclude or 'only:test1,test2' to run exclusively"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      max_workers:
        required: true
        type: number
      netsim_branch:
        required: true
        type: string
      rust_log:
        description: "Custom RUST_LOG value (e.g. 'iroh=debug,noq=trace'). If empty, defaults to warn."
        required: false
        type: string
        default: ""
      build_profile:
        required: false
        type: string
        default: "release"
      sim_paths:
        required: false
        type: string
        default: "sims/iroh,sims/integration"
      publish_metrics:
        required: false
        type: boolean
        default: false
      pr_number:
        required: false
        type: string
        default: ""
      report_table:
        required: false
        type: boolean
        default: false
      filter:
        description: "Test filter: 'skip:test1,test2' to exclude or 'only:test1,test2' to run exclusively. No prefix defaults to only."
        required: false
        type: string
        default: ""
    secrets:
      S3_ACCESS_KEY_ID:
        required: false
      S3_ACCESS_KEY:
        required: false
      S3_REPORT_BUCKET:
        required: false
      S3_BUCKET:
        required: false
      METRO_TOKEN:
        required: false
      METRO_ENDPOINT:
        required: false

permissions:
  contents: read

concurrency:
  group: netsim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  MSRV: "1.66"
  # SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  netsim:
    permissions:
      contents: read
      # These permissions are used only for trusted reports and PR comments.
      issues: write
      pull-requests: write
    name: Netsim
    timeout-minutes: 45
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, linux, X64]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        submodules: recursive
        repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        ref: ${{ inputs.branch || github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false

    - name: Install rust stable
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

    - name: Install sccache
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
      continue-on-error: true
    - uses: ./.github/workflows/sccache-probe

    - name: Build iroh
      env:
        BUILD_PROFILE: ${{ inputs.build_profile }}
      run: |
        cargo build --profile "$BUILD_PROFILE" --workspace --all-features --examples --bins

    - name: Fetch netsim
      env:
        NETSIM_BRANCH: ${{ inputs.netsim_branch }}
      run: |
        cd ..
        rm -rf chuck
        git clone --depth 1 --single-branch --branch "$NETSIM_BRANCH" https://github.com/n0-computer/chuck.git

    - name: Install netsim deps
      run: |
        cd ../chuck/netsim
        sudo apt update
        ./setup.sh
        ./cleanup.sh || true

    - name: Copy sim configs
      run: |
        cp -r .github/sims/iroh/ ../chuck/netsim/sims/iroh/
        cp -r .github/sims/integration/ ../chuck/netsim/sims/integration/
        cp -r .github/sims/paused/ ../chuck/netsim/sims/paused/

    - name: Copy binaries to right location
      env:
        BUILD_PROFILE: ${{ inputs.build_profile }}
      run: |
        cp "target/${BUILD_PROFILE}/examples/"* ../chuck/netsim/bins/
        cp -- "target/${BUILD_PROFILE}/examples/transfer" ../chuck/netsim/bins/iroh-transfer
        cp -- "target/${BUILD_PROFILE}/iroh-relay" ../chuck/netsim/bins/iroh-relay
        cp -- "target/${BUILD_PROFILE}/iroh-dns-server" ../chuck/netsim/bins/iroh-dns-server

    - name: Get commit sha
      shell: bash
      run: |
        printf 'LAST_COMMIT_SHA=%s\n' "$(git rev-parse --short "$GITHUB_SHA")" >> "$GITHUB_ENV"

    - name: Run tests
      id: run_tests
      continue-on-error: true
      env:
        SIM_PATHS: ${{ inputs.sim_paths }}
        RUST_LOG_VALUE: ${{ inputs.rust_log }}
        TEST_FILTER: ${{ inputs.filter }}
        MAX_WORKERS: ${{ inputs.max_workers }}
      run: |
        cd ../chuck/netsim
        IFS=',' read -ra sim_paths <<< "$SIM_PATHS"
        filter="$TEST_FILTER"
        filter_flag=""
        if [[ -n "${filter}" ]]; then
          if [[ "${filter}" == skip:* ]]; then
            filter_flag="--skip=${filter#skip:}"
          elif [[ "${filter}" == only:* ]]; then
            filter_flag="--only=${filter#only:}"
          else
            filter_flag="--only=${filter}"
          fi
        fi
        args=("--max-workers=$MAX_WORKERS" --integration)
        if [[ -n "$filter_flag" ]]; then
          args=("$filter_flag" "${args[@]}")
        fi
        for sim_path in "${sim_paths[@]}"; do
          if [[ -n "${RUST_LOG_VALUE}" ]]; then
            sudo env RUST_LOG="$RUST_LOG_VALUE" python3 main.py "${args[@]}" "$sim_path"
          else
            sudo python3 main.py "${args[@]}" "$sim_path"
          fi
        done

    - name: Generate report
      id: generate_report
      if: always()
      run: |
        cd ../chuck/netsim
        python3 reports_csv.py --table > report_table.txt
        python3 reports_csv.py --prom --commit "$LAST_COMMIT_SHA" > report_prom.txt
        python3 reports_csv.py --metro --commit "$LAST_COMMIT_SHA" > report_metro.txt
        python3 reports_csv.py --metro --integration --commit "$LAST_COMMIT_SHA" > report_metro_integration.txt

    - name: Download awscli
      if: always()
      run: |
        mkdir -p ~/awscli
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o ~/awscli/awscliv2.zip
        cd ~/awscli && unzip -oq awscliv2.zip

    - name: Install awscli
      if: always()
      run: sudo ~/awscli/aws/install --update

    - name: Upload report
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
        AWS_DEFAULT_REGION: us-west-2
        REPORT_BUCKET: ${{ secrets.S3_BUCKET }}
        REPORT_PATH_BUCKET: ${{ secrets.S3_REPORT_BUCKET }}
      run: |
        cd ../chuck/netsim

        aws_fname="${LAST_COMMIT_SHA}.tar.gz"
        tar -cvzf report.tar.gz report_prom.txt report_table.txt report_metro.txt report_metro_integration.txt logs/ report/ viz/
        if [[ -n "$REPORT_BUCKET" ]]; then
          aws s3 cp ./report.tar.gz "s3://${REPORT_PATH_BUCKET}/${aws_fname}" --no-progress
        fi

    - name: Move report
      if: always()
      run: |
        cp ../chuck/netsim/report.tar.gz ./report.tar.gz

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      id: upload-report
      with:
        name: netsim-report-${{ env.LAST_COMMIT_SHA }}
        path: report.tar.gz
        retention-days: 3
        overwrite: true

    - name: Fail Job if Tests Failed
      if: ${{ steps.run_tests.outcome == 'failure' }}
      env:
        REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
      run: |
        echo "Tests failed. Report: $REPORT_URL"
        echo ""
        if [ -f ../chuck/netsim/logs/failed_tests.txt ]; then
          echo "=== FAILED TESTS ==="
          cat ../chuck/netsim/logs/failed_tests.txt
        fi
        exit 1

    - name: Find Docs Comment
      if: ${{ inputs.pr_number != '' }}
      uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad
      id: fc
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-author: 'github-actions[bot]'
        body-includes: Netsim report & logs for this PR have been generated

    - name: Create or Update Docs Comment
      if: >-
        inputs.pr_number != '' &&
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
      with:
        issue-number: ${{ inputs.pr_number }}
        comment-id: ${{ steps.fc.outputs.comment-id }}
        body: |
          Netsim report & logs for this PR have been generated and is available at: [LOGS](${{steps.upload-report.outputs.artifact-url}})
          This report will remain available for 3 days.

          Last updated for commit: ${{ env.LAST_COMMIT_SHA }}
        edit-mode: replace

    - name: Generate report table
      if: ${{ inputs.pr_number != '' && inputs.report_table}}
      id: generate_report_table
      run: |
        cd ../chuck/netsim
        export NETSIM_REPORT=$(cat report_table.txt)
        echo "NETSIM_REPORT<<EOFMARKER" >> ${GITHUB_OUTPUT}
        echo "${NETSIM_REPORT}" >> ${GITHUB_OUTPUT}
        echo "EOFMARKER" >> ${GITHUB_OUTPUT}

    - name: Echo Report Table on PR
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9
      if: >-
        inputs.pr_number != '' && inputs.report_table &&
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
      with:
        issue-number: ${{ inputs.pr_number }}
        body: |
          `${{ inputs.branch }}.${{ env.LAST_COMMIT_SHA }}`
          Perf report:
          ${{ steps.generate_report_table.outputs.NETSIM_REPORT }}

    - name: Publish metrics
      if: >-
        inputs.publish_metrics &&
        ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
      env:
        METRO_TOKEN: ${{ secrets.METRO_TOKEN }}
        METRO_ENDPOINT: ${{ secrets.METRO_ENDPOINT }}
      run: |
        cd ../chuck/netsim
        d=$(cat report_metro.txt)
        metro_data=$(printf "%s\n " "$d")
        curl -X POST -H  "Content-Type: application/json" -H "Authorization: Bearer $METRO_TOKEN" --data "$metro_data" "$METRO_ENDPOINT"
        d=$(cat report_metro_integration.txt)
        metro_data=$(printf "%s\n " "$d")
        curl -X POST -H  "Content-Type: application/json" -H "Authorization: Bearer $METRO_TOKEN" --data "$metro_data" "$METRO_ENDPOINT"

    - name: Echo metrics (debug)
      run: |
        cd ../chuck/netsim
        d=$(cat report_metro.txt)
        metro_data=$(printf "%s\n " "$d")
        echo "$metro_data"
        d=$(cat report_metro_integration.txt)
        metro_data=$(printf "%s\n " "$d")
        echo "$metro_data"

    - name: Cleanup
      run: |
        ./cleanup.sh || true
