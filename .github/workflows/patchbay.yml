name: Patchbay Tests

on:
  # Keep the workflow definition on the base branch before using a persistent
  # self-hosted runner.
  pull_request_target:
  push:
    branches:
      - main

concurrency:
  group: patchbay-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  SCCACHE_CACHE_SIZE: "10G"
  IROH_FORCE_STAGING_RELAYS: "1"
  NEXTEST_VERSION: "0.9.80"

permissions:
  contents: read

jobs:
  patchbay_tests:
    name: Patchbay Tests
    timeout-minutes: 15
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: [self-hosted, linux, X64]
    env:
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        continue-on-error: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        continue-on-error: true
      - uses: ./.github/workflows/sccache-probe
      - name: Install cargo-make and cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }},cargo-make

      - name: Build patchbay tests
        run: cargo make patchbay --no-run

      - name: Run patchbay tests
        run: |
          set -o pipefail
          cargo make patchbay 2>&1 | tee "$RUNNER_TEMP/logs.txt"
        env:
          PATCHBAY_LOG: ${{ runner.debug && 'trace' || 'debug' }}
          RUST_LOG: ${{ runner.debug && 'trace' || 'debug' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: patchbay-testdir-${{ github.sha }}
          path: |
            target/testdir-current/
            ${{ runner.temp }}/logs.txt
          retention-days: 7
          if-no-files-found: ignore
