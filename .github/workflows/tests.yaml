# Run all tests, with or without flaky tests.

name: Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      rust-version:
        description: "The version of the rust compiler to run"
        type: string
        default: "stable"
      flaky:
        description: "Whether to also run flaky tests"
        type: boolean
        default: false
      git-ref:
        description: "Which git ref to checkout"
        type: string
        default: ""
    secrets:
      RUNNER_READ_TOKEN:
        description: PAT with read:org scope for runner availability query
        required: false

env:
  RUST_BACKTRACE: 1
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings
  SCCACHE_CACHE_SIZE: "10G"
  CRATES_LIST: "iroh,iroh-bench,iroh-dns-server,iroh-relay"
  IROH_FORCE_STAGING_RELAYS: "1"
  NEXTEST_VERSION: "0.9.80"
  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  PR_REF: ${{ inputs.git-ref || github.event.pull_request.head.sha || github.sha }}

jobs:
  pick-runner:
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    uses: "./.github/workflows/pick-runner.yml"
    with:
      min_free_runners: 3
    secrets:
      RUNNER_READ_TOKEN: >-
        ${{
          ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) &&
          secrets.RUNNER_READ_TOKEN || ''
        }}

  # Windows overflow routing onto Blacksmith, with its own idle count and an
  # independent Blacksmith cap of 4 (see blacksmith_busy_match: windows).
  pick-runner-windows:
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    uses: "./.github/workflows/pick-runner.yml"
    with:
      core_runner: '["self-hosted","windows","x64"]'
      overflow_runner: '["blacksmith-4vcpu-windows-2025"]'
      hosted_fallback_runner: '["windows-latest"]'
      blacksmith_busy_match: windows
      max_blacksmith_concurrent: 4
      min_free_runners: 1
    secrets:
      RUNNER_READ_TOKEN: >-
        ${{
          ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) &&
          secrets.RUNNER_READ_TOKEN || ''
        }}

  build_and_test_nix:
    timeout-minutes: 30
    name: "Tests"
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: pick-runner
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu-latest, macOS-arm-latest]
        rust: ["${{ inputs.rust-version }}"]
        features: [all, none, default]
        include:                                                                                                                                                         
            # ubuntu cells route via pick-runner slots 1-3                                                                                                                 
            - name: ubuntu-latest                                                                                   
              features: all                                                                                                                                                
              os: ubuntu-latest
              release-os: linux                                                                                                                                            
              release-arch: amd64                                                                                                                                          
              runs_on: ${{ needs.pick-runner.outputs.overflow_1 }}
            - name: ubuntu-latest                                                                                                                                          
              features: none                                                                                                                                               
              os: ubuntu-latest       
              release-os: linux                                                                                                                                            
              release-arch: amd64                                                                                   
              runs_on: ${{ needs.pick-runner.outputs.overflow_2 }}
            - name: ubuntu-latest                                                                                                                                          
              features: default
              os: ubuntu-latest                                                                                                                                            
              release-os: linux                                                                                     
              release-arch: amd64     
              runs_on: ${{ needs.pick-runner.outputs.overflow_3 }}
            # mac cells always stay on self-hosted mac (not in the routing pool)                                                                                           
            - name: macOS-arm-latest                                                                                                                                       
              features: all                                                                                                                                                
              os: macOS-latest                                                                                                                                             
              release-os: darwin                                                                                                                                           
              release-arch: aarch64   
              runs_on: '["self-hosted","macOS","ARM64"]'                                                                                                                   
            - name: macOS-arm-latest                                                                                
              features: none                                                                                                                                               
              os: macOS-latest
              release-os: darwin                                                                                                                                           
              release-arch: aarch64                                                                                 
              runs_on: '["self-hosted","macOS","ARM64"]'
            - name: macOS-arm-latest                                                                                                                                       
              features: default
              os: macOS-latest                                                                                                                                             
              release-os: darwin                                                                                    
              release-arch: aarch64   
              runs_on: '["self-hosted","macOS","ARM64"]'
    env:
      # Using self-hosted runners so use local cache for sccache and
      # not SCCACHE_GHA_ENABLED.
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Configure sccache backend                                                                               
        shell: bash                     
        run: |
            if [[ "${RUNNER_NAME:-}" == blacksmith-* ]]; then                                                                                                                  
              echo "Runner: $RUNNER_NAME → GHA-backed sccache"
              echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"                                                                                                                   
            else                                                                                                                                                               
              echo "Runner: $RUNNER_NAME → local-disk sccache"                                                                                                                 
              # leave SCCACHE_GHA_ENABLED unset; sccache defaults to local disk                                                                                                
            fi     
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false

      - name: Install ${{ matrix.rust }} rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        continue-on-error: true
      - uses: ./.github/workflows/sccache-probe

      - name: Select features
        run: |
          case "${{ matrix.features }}" in
              all)
                  echo "FEATURES=--all-features" >> "$GITHUB_ENV"
                  ;;
              none)
                  echo "FEATURES=--no-default-features" >> "$GITHUB_ENV"
                  ;;
              default)
                  echo "FEATURES=" >> "$GITHUB_ENV"
                  ;;
              *)
                  exit 1
          esac

      - name: check features
        if: ${{ ! inputs.flaky }}
        run: |
          for i in ${CRATES_LIST//,/ }
          do
            echo "Checking $i $FEATURES"
            targets="--lib --bins"
            echo cargo check -p $i $FEATURES $targets
            cargo check -p $i $FEATURES $targets
          done
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}

      - name: build tests
        run: |
          cargo nextest run --workspace ${{ env.FEATURES }} --lib --bins --tests --no-run

      - name: list ignored tests
        run: |
          cargo nextest list --workspace ${{ env.FEATURES }} --lib --bins --tests --run-ignored ignored-only

      - name: run tests
        run: |
          mkdir -p output
          cargo nextest run --workspace ${{ env.FEATURES }} --lib --bins --tests --profile ci --run-ignored ${{ inputs.flaky && 'all' || 'default' }} ${{ inputs.flaky && '--verbose' || '' }} --no-fail-fast --message-format ${{ inputs.flaky && 'libtest-json' || 'human' }} > output/${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}.json
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1

      - name: upload results
        if: ${{ failure() && inputs.flaky }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: libtest_run_${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}.json
          path: output
          retention-days: 45
          compression-level: 0

      - name: doctests
        if: ${{ (! inputs.flaky) &&  matrix.features == 'all' }}
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
        run: |
          cargo test --workspace --all-features --doc

      # We can not check the doctest features by only compiling them,
      # so are forced to run them once more.
      - name: Check doctest features
        if: ${{ ! inputs.flaky }}
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
        run: |
          for i in ${CRATES_LIST//,/ }
          do
            echo "Checking $i doctest $FEATURES"
            echo cargo test -p $i --doc $FEATURES
            cargo test -p $i --doc $FEATURES
          done

  build_and_test_windows:
    timeout-minutes: 30
    name: "Tests"
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: pick-runner-windows
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        name: [windows-latest]
        rust: ["${{ inputs.rust-version}}"]
        features: [all, none, default]
        target:
          - x86_64-pc-windows-msvc
        include:
          # windows cells route via pick-runner-windows slots 1-3
          - name: windows-latest
            features: all
            os: windows
            runs_on: ${{ needs.pick-runner-windows.outputs.overflow_1 }}
          - name: windows-latest
            features: none
            os: windows
            runs_on: ${{ needs.pick-runner-windows.outputs.overflow_2 }}
          - name: windows-latest
            features: default
            os: windows
            runs_on: ${{ needs.pick-runner-windows.outputs.overflow_3 }}
    env:
      # sccache backend is selected at runtime in "Configure sccache backend":
      # local disk on self-hosted, GHA-backed on Blacksmith (ephemeral).
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Configure sccache backend
        shell: bash
        run: |
            if [[ "${RUNNER_NAME:-}" == blacksmith-* ]]; then
              echo "Runner: $RUNNER_NAME → GHA-backed sccache"
              echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
            else
              echo "Runner: $RUNNER_NAME → local-disk sccache"
              # leave SCCACHE_GHA_ENABLED unset; sccache defaults to local disk
            fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false

      - name: Install ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }}
          rustup toolchain default ${{ matrix.rust }}
          rustup target add ${{ matrix.target }}
          rustup set default-host ${{ matrix.target }}

      - name: Cache cargo-nextest
        id: cache-nextest
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cargo/bin/cargo-nextest.exe
          key: nextest-windows-${{ env.NEXTEST_VERSION }}

      - name: Install cargo-nextest
        if: steps.cache-nextest.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $tmp = New-TemporaryFile | Rename-Item -NewName { $_ -replace 'tmp$', 'zip' } -PassThru
          Invoke-WebRequest -OutFile $tmp https://get.nexte.st/${{ env.NEXTEST_VERSION }}/windows
          $outputDir = if ($Env:CARGO_HOME) { Join-Path $Env:CARGO_HOME "bin" } else { "~/.cargo/bin" }
          $tmp | Expand-Archive -DestinationPath $outputDir -Force
          $tmp | Remove-Item

      - name: Select features
        run: |
          switch ("${{ matrix.features }}") {
              "all" {
                  echo "FEATURES=--all-features" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
              }
              "none" {
                  echo "FEATURES=--no-default-features" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
              }
              "default" {
                  echo "FEATURES=" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append
              }
              default {
                  Exit 1
              }
          }

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        continue-on-error: true
      - uses: ./.github/workflows/sccache-probe

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          # Blacksmith's Windows image ships no pre-installed MSYS2 (C:\msys64),
          # so install it there. Self-hosted keeps the pre-installed one (faster).
          release: ${{ startsWith(runner.name, 'blacksmith-') }}

      - name: Install aws-lc-sys build dependencies
        shell: powershell
        run: |
          $chocoPath = "$Env:ProgramData\chocolatey\bin\choco.exe"
          if (!(Test-Path $chocoPath)) {
            $chocoPath = "$Env:SystemDrive\ProgramData\chocolatey\bin\choco.exe"
          }
          & $chocoPath install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          & $chocoPath install nasm -y
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NASM" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: build tests
        run: |
          cargo nextest run --workspace ${{ env.FEATURES }} --lib --bins --tests --target ${{ matrix.target }} --no-run

      - name: list ignored tests
        run: |
          cargo nextest list --workspace ${{ env.FEATURES }} --lib --bins --tests --target ${{ matrix.target }} --run-ignored ignored-only

      - name: tests
        run: |
          mkdir -p output
          cargo nextest run --workspace ${{ env.FEATURES }} --lib --bins --tests --profile ci --target ${{ matrix.target }} --run-ignored ${{ inputs.flaky && 'all' || 'default' }} --no-fail-fast --message-format ${{ inputs.flaky && 'libtest-json' || 'human' }} > output/${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}.json
        env:
          RUST_LOG: ${{ runner.debug && 'TRACE' || 'DEBUG'}}
          NEXTEST_EXPERIMENTAL_LIBTEST_JSON: 1

      - name: upload results
        if: ${{ failure() && inputs.flaky }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: libtest_run_${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.name }}_${{ matrix.features }}_${{ matrix.rust }}.json
          path: output
          retention-days: 1
          compression-level: 0

  minimal-crates:
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name: [ubuntu-latest, macOS-arm-latest] # TODO: windows
        include:
          - name: ubuntu-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: amd64
            runner: [self-hosted, linux, X64]
          - name: macOS-arm-latest
            os: macOS-latest
            release-os: darwin
            release-arch: aarch64
            runner: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb
      - name: cargo check
        run: |
          rm -f Cargo.lock
          cargo +nightly check -Z minimal-versions --workspace --all-features --lib --bins

  minimal-crates-windows:
    timeout-minutes: 30
    name: "Minimal Crates (Windows)"
    if: >-
      github.repository == 'manaflow-ai/iroh' &&
      github.event_name != 'merge_group' &&
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: pick-runner-windows
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    strategy:
      fail-fast: false
      matrix:
        name: [windows-latest]
        rust: ["${{ inputs.rust-version}}"]
        target:
          - x86_64-pc-windows-msvc
        include:
          # distinct slot (4) so it can run alongside the 3 build cells
          - name: windows-latest
            os: windows
            runs_on: ${{ needs.pick-runner-windows.outputs.overflow_4 }}
    env:
      # sccache backend is selected at runtime in "Configure sccache backend":
      # local disk on self-hosted, GHA-backed on Blacksmith (ephemeral).
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Configure sccache backend
        shell: bash
        run: |
            if [[ "${RUNNER_NAME:-}" == blacksmith-* ]]; then
              echo "Runner: $RUNNER_NAME → GHA-backed sccache"
              echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
            else
              echo "Runner: $RUNNER_NAME → local-disk sccache"
              # leave SCCACHE_GHA_ENABLED unset; sccache defaults to local disk
            fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ env.PR_REPOSITORY }}
          ref: ${{ env.PR_REF }}
          persist-credentials: false

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup target add ${{ matrix.target }}
          rustup set default-host ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        continue-on-error: true
      - uses: ./.github/workflows/sccache-probe

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          # Blacksmith's Windows image ships no pre-installed MSYS2 (C:\msys64),
          # so install it there. Self-hosted keeps the pre-installed one (faster).
          release: ${{ startsWith(runner.name, 'blacksmith-') }}

      - name: Install aws-lc-sys build dependencies
        shell: powershell
        run: |
          $chocoPath = "$Env:ProgramData\chocolatey\bin\choco.exe"
          if (!(Test-Path $chocoPath)) {
            $chocoPath = "$Env:SystemDrive\ProgramData\chocolatey\bin\choco.exe"
          }
          & $chocoPath install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
          & $chocoPath install nasm -y
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NASM" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append

      - name: cargo check
        run: |
          rm -Force Cargo.lock
          cargo +nightly check -Z minimal-versions --workspace --all-features --lib --bins
